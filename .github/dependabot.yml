version: 2
updates:
  # Root (npm workspaces)
  # engine / frontend / backend は npm workspaces なので、このエントリだけで
  # 全ワークスペースの依存を更新できる。ワークスペース個別のディレクトリを
  # 指定すると、その package.json だけが更新されてルートの package-lock.json が
  # 取り残され、CI の `npm ci` が lockfile 不整合で失敗する
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # TypeScript 7.0 はネイティブ (Go) 実装で typescript/lib/tsc を公開しないため、
      # それを require する vue-tsc (Volar) が起動できない。
      # Volar が使えるプログラマティック API は TS 7.1 で安定予定なので、
      # 7.0.x だけを無視して 7.1 の PR は受け取る（CI が可否を判定する）。
      # 7.1 でもまだ動かなければ 7.1.x をこの一覧に追加する
      - dependency-name: "typescript"
        versions: ["7.0.x"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions。PR は .github/workflows/actions.lock の該当エントリも作り直す。
  # cooldown: 公開から 3 日経った版だけを取り込む。問題のある版や、乗っ取られて公開された版は、
  # たいてい数日のうちに取り下げられるため。セキュリティ更新は対象外なので遅れない
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
